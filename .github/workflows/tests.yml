name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    # Official Python images, so the oldest supported version stays testable
    # whatever the runner image ships.
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      # Referee has no dependencies, so there is nothing to install.
      - run: python -W error -m unittest discover -s tests -t .
      - run: python -m referee plan demo/plan.json

  mcp-client:
    # Referee implements the MCP protocol by hand; this checks it against the
    # official client. The calls that need a Flagsmith are skipped here.
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet mcp
      - run: python tests/mcp_official_client.py
