name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    # Official Python images, so the oldest supported version stays testable
    # whatever the runner image ships.
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      # Referee has no dependencies, so there is nothing to install.
      - run: python -W error -m unittest discover -s tests -t .
      - run: python -m referee plan demo/plan.json
